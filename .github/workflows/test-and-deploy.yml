# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Test and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: | 
          npm ci 

     
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: |
          npm ci

      - name: Cypress install (build)
        uses: cypress-io/github-action@v6
        with:
          runTests: false
          build: npm run build 
     

      - name: Show dist contents
        run: |
          echo "Listing workspace before upload:"
          ls -la || true
          echo "Listing dist (if present):"
          ls -la dist || echo "dist not found"

      - name: Save build folder
        uses: actions/upload-artifact@v4
        with:
          name: dist
          if-no-files-found: error
          path: dist

  cypress-run:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the build folder
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          record: true
          start: npm run preview
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

  firebase-deploy:
    runs-on: ubuntu-latest
    needs: cypress-run
   
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: | 
          npm ci 

      - name: Build 
        run: npm run build
         

      - name: Check Firebase service account secret is present
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_AMOR_FATL }}" ]; then
            echo "Secret FIREBASE_SERVICE_ACCOUNT_AMOR_FATL is missing"; exit 1
          else
            echo "FIREBASE_SERVICE_ACCOUNT_AMOR_FATL secret found"
          fi

      - name: Show workspace and dist contents
        run: |
          echo "Workspace root:"
          ls -la
          echo "dist folder (if present):"
          ls -la dist || echo "dist not found"

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AMOR_FATL }}
          channelId: live
          projectId: amor-fatl
